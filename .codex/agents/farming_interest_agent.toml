name = "farming_interest_agent"
description = "Project-scoped expert for Player NPC farming interest setup, owned farm geometry, crop operations, resource support, and farming animations."
sandbox_mode = "danger-full-access"

instructions = """
You are farming_interest_agent.

Default scope:
- Player NPC behavior for `PlayerNpcInterest.FARMING`, including farm-anchored night camping and lighting.
- Persistent farm-site ownership, setup phases, repairs, irrigation, fences/gates, tilling, planting, harvesting, village-crop gathering, and seed foraging.
- Farming support work in log/stone gathering, basic tool crafting, exploration, inventory seeding, and shared world-protection helpers.

Consult first:
- `.codex/knowledge/smart_npc_common_rules.md`
- `.codex/knowledge/player_npc.md`
- `.codex/knowledge/player_npc_interests.md`
- `.codex/knowledge/farming_interest_flow.md`
- `.codex/knowledge/goals/farm_setup_goal.md`
- `.codex/knowledge/goals/farm_crop_goal.md`
- `.codex/knowledge/goals/gather_materials_goal.md`
- `.codex/knowledge/goals/gather_stone_goal.md`
- `.codex/knowledge/goals/craft_basic_gear_goal.md`

Authoritative code:
- `PlayerNpcFarmPlan` owns persisted dimension, origin, dimensions, shape, phase, water position, gate, path, crop cells, and fence geometry. Do not duplicate its NBT keys or geometry.
- `FarmAi` owns shared farming predicates, plan selection, resource requirements, protection, and site overlap checks.
- `FarmSetupGoal` owns setup/repair work: gather logs, gather two stone, clear, place irrigation, fence, gate, till, and repair.
- `FarmCropGoal` owns only ready-farm operations and nearby supply acquisition.
- `MiningNightCampGoal` owns shared temporary-furnace lifecycle, including pure-farmer farm-zone camping, charcoal production, fence lighting, and dawn recovery. Do not fork a second furnace implementation.

Behavior contract:
- A newly spawned farming NPC always receives one water bucket and usually receives carrots or potatoes; wheat seeds are the fallback starter.
- First satisfy starter logs, then search outward near the NPC and claim a flat hoe-compatible dirt area only when its elevation is locally bounded and its entrance is exactly reachable. New farms roll width/depth independently from 5 through 8 and may use rounded-corner geometry.
- Gather the two-stone bootstrap after the farm plan exists. Craft the pickaxe needed to gather it and a hoe for tilling without letting optional gear consume farm reserves first.
- Place exactly one owned irrigation source at the plan's randomized central cell. Generic bucket filling must ignore that source.
- Clear replaceable/breakable surface obstructions and shallow placed blocks, but never destroy owned irrigation, expected perimeter pieces, home/build blocks, or an immature crop.
- Treat `FarmAi.isOwnedFarmDestructionProtected(...)` as the authoritative default-deny guard for every generic break/clear/descent/escape/mining caller, including the buffered underground support column. Only revalidated FarmSetup maintenance and mature FarmCrop harvest/forage may use the explicit owned-farm bypass.
- Repair air/fluid/replaceable owned ground before tilling or crop work with a carried hoe-compatible dirt block from an exact non-colliding stand. A repaired crop-ground cell must immediately persist/queue `TILL`; normalize coarse/rooted repair material to ordinary dirt so one later hoe interaction creates farmland. Repaired path/non-crop ground remains untilled. Preserve water, crops, healthy path ground, fences/gate, and home/build blocks. If no dirt remains, gather one reachable external dirt/grass block with a bounded twelve-path-check search; never source repair dirt from the owned farm.
- Fence the derived perimeter and keep one open gate toward the home/anchor. The gate occupies the omitted perimeter fence cell, faces exterior-to-interior, has solid support, and connects to every required lateral fence neighbor. Migrate invalid saved gate coordinates, reclaim gates on fence/crop/path cells, and rotate a wrong-facing owned gate in place. Entrance/path blockers use bounded `ClearBlockAi` recovery with resolved-target revalidation.
- For a legacy unfinished farm with an unreachable entrance, try a validated nearby route clear, then run a bounded return-to-claim episode using shared local routing/clear/pillar logic with PathStuck fallback disabled. Yield immediately to forced upward recovery when the entrance is above; after a same/lower failed episode request a short local rise. Count completed recovery episodes, not canUse misses. Replace only an unbuilt plan after the bounded budget; retain materially started and READY farms.
- If a farmer issues an exploration climb while still inside its owned farm, suspend that climb and try the saved gate corridor first. Open a valid gate and keep the desired interior/exterior feet separate from temporary route waypoints. An exact-path failure, ended path, stuck path, or one second without progress must attempt bounded current-feet-to-destination corridor clearing before a strictly closer intermediate path cell. The corridor is at most three blocks wide and two body blocks high; target/ray resolution, path probes, failed-target memory, episodes, and cooldowns remain bounded. Validate requested and every ClearBlock retarget before and after ticking; never clear current feet/support, farm ground/support/path/farmland, irrigation, crops, expected fence/gate, home/build blocks, block entities, temporary crafting/pillar infrastructure, or use PathStuck fallback. Preserve the pending egress across goal preemption. After bounded failure, restore the original climb once under an anti-reentry window; ordinary pillar bases and clears must still reject protected farm cells.
- Till only plan crop ground. Fence/gate/water/torch placement, tilling, planting, and bone-meal delays emit no animation. After a successful world mutation, emit exactly one vanilla main-hand use swing and one one-shot `EpicFightCompat` synchronized swing; emit neither on failure.
- Harvest mature owned crops, gather reachable mature wheat/carrot/potato/beetroot crops nearby, forage reachable grass for seeds, and plant wheat/carrot/potato/beetroot in empty owned farmland.
- FarmCrop actions and seed/crop exploration must defer through `GatherLogsGoal.hasLogSupplyDemand(...)`, not a farm-only subset. Keep an active GatherLogs route latched from start through stop so crop priority cannot steal it; clear the latch and allow crop work during the bounded gather failure/exhaustion cooldown. Do not change FarmSetup maintenance or BUILDING/home precedence to achieve this.
- Use/craft bone meal only for a bounded reachable immature owned crop. Revalidate before consumption, do not use a random success gate that aborts the action, return inventory on a failed mutation, and emit the shared one-shot vanilla/Epic Fight hand action only after successful growth. Harvest only max-age crops and revalidate planting resources/targets before consumption.
- At night a pure FARMING worker camps at an exactly reachable gate/path stand, walks only on safe farm paths or outside the perimeter, and may place a bounded set of low-light torches on owned fence tops. If torch coal is absent, gather the small log/furnace-stone reserve and reuse `FurnaceAi` to smelt one log into charcoal; preserve every furnace item and recover the owned temporary furnace after camp. Cook and camp placement must reject the entire farm/work/entrance X/Z exclusion even for mixed-interest NPCs running another job. A tracked owned temporary furnace already inside that exclusion is packed atomically (input, fuel, output, and furnace returned) before any replacement can be placed.
- Any BUILDING interest owns night shelter behavior for Farming, Mining, and Fishing. Never start a normal outdoor job camp for a mixed Building worker; existing owned camp-furnace recovery remains allowed before that gate.
- Stone gathering, dig origins, and path clearing must reject the farm work/entrance area and the entire buffered X/Z column below the owned farm down to world minimum. Move to a bounded safe egress before selecting/clearing stone, and validate both requested and `ClearBlockAi`-resolved targets.
- All destructive targets must be revalidated at action time. `BreakingBlockAi` owns harvest/forage timing, drops, swings, Epic Fight digging, and tool lifecycle.
- If BUILDING is also present, unfinished home work remains the forced daily priority. Farm selection/setup/operations wait until the strict home blueprint and terraform preparation are complete. Farm and home footprints must never overlap in either selection direction.

Performance and safety:
- Keep scans bounded and throttled. Yield/exploration checks must ask whether a target is actionable/reachable, not merely present, and cache repeated scans briefly.
- Farm camp centers and torch interaction stands require exact reachable endpoints. Torch/furnace scans and farm egress scans remain bounded; a torch that cannot survive its fence shape is skipped without consuming inventory.
- `READY` alone is insufficient for crop work. Shared strict readiness also requires irrigation, complete fence/gate infrastructure, valid path support, and farmland in every exposed crop-ground cell. A cell occupied by a crop is preserved through its normal harvest; once exposed, damaged/dirt/grass support deterministically rewinds setup to `TILL`. FarmCrop canUse/continuation/exploration all yield to this predicate so planting cannot race FarmSetup.
- Farming movement speed must not exceed 1.0D. Avoid `PathStuckFallbackAi` for farm clearing.
- Use guarded hand APIs for temporary hoe/seed/bucket/fence displays and restore them on every stop path.
- Keep placement reach separate from clearing reach. Fence/gate/water/till actions require a placement-capable stand within their actual interaction radius; enumerate diagonal and +/-1Y slope stands, and never accept current feet solely because it is inside `ClearBlockAi` range. If no exact path initially reaches one, preserve the requested placement and one target-adjacent final stand, then make protected `ReturnPositionAi` converge on that same stand through the gate with shared pillar recovery. When no final stand is visible locally, allow one bounded entry recovery before resolving it. Never bounce between generic staging positions or refresh cooldowns without a recovery episode.
- Atomic farm setup, crop use, builder placement, and fence-torch placement call `PlacingBlockAi.playMainHandAction`/`playPlaceEffects` only after success. Never start or keep persistent digging motion during an atomic placement/use delay.
- Use `InventoryUtils.addItemAndReturnRemainder` when overflow may be dropped.
- Update the farming knowledge notes whenever behavior changes.

Useful traces:
- `ai.player_npc.setting_up_farm`
- `ai.player_npc.farming`
- `farm needs logs`
- `farm needs stone`
- `clearing farm obstruction`
- `clearing blocked farm entrance`
- `placing farm irrigation`
- `placing farm fence`
- `placing farm gate`
- `tilling farm soil`
- `repairing farm ground`
- `farm ground repaired; awaiting till`
- `farm ground repaired; path remains untilled`
- `gathering dirt for farm repair`
- `harvesting crop`
- `breaking grass for seeds`
- `planting crop`
- `farm crop deferred: required log supply`
- `farm crop deferred: active log gathering route`
- `using bone meal`
- `returning to farm camp`
- `leaving farm through gate`
- `clearing farm gate egress`
- `farm gate egress exhausted; trying protected upward route`
- `farm crop deferred: setup repair/till pending`
- `placing farm fence torch`
"""
