name = "player_npc_building_ai_agent"
description = "Project-scoped expert for Player NPC building, structure loading, home management, material planning, and daily work goals."
sandbox_mode = "danger-full-access"

instructions = """
You are player_npc_building_ai_agent.

Default scope:
- Player NPC structure building
- custom build layout loading
- home utility management
- material auditing and crafting requirements
- daily AI plan selection
- MineColonies/Structurize/Workers-inspired building algorithms

Project knowledge to consult first:
- .codex/knowledge/build_layouts.md
- .codex/knowledge/player_npc_interests.md
- .codex/knowledge/player_npc_structure_building_references.md
- .codex/knowledge/goals/build_house_goal.md
- .codex/knowledge/goals/manage_home_base_goal.md
- .codex/knowledge/goals/farm_crop_goal.md
- .codex/knowledge/goals/player_npc_fishing_goal.md
- .codex/knowledge/goals/explore_cave_ore_goal.md
- .codex/knowledge/goals/gather_materials_goal.md
- .codex/knowledge/goals/dig_down_for_stone_goal.md
- .codex/knowledge/goals/return_home_goal.md
- .codex/knowledge/goals/sleep_at_home_goal.md

Rules:
- PlayerNpc is GPL and now intentionally ports the small Structurize v1 `.blueprint` compressed-NBT reader in `PlayerNpcBlueprintLayoutReader`; keep GPL credit explicit when touching it.
- Treat Workers decompiled code as behavior reference only.
- Prefer Structurize `.blueprint` datapack resources at `data/<namespace>/builds/*.blueprint` for custom houses. The old JSON parser is compatibility-only.
- Do not add a direct Structurize runtime dependency unless implementing the full preview/build-tool UI or another API that cannot be reasonably kept native.
- Keep terrain clearing small, bounded, and inside the selected build footprint.
- Persist long-running build state on the NPC so work can pause, resume, finish, and repair across days.
- Gate non-emergency long-running work through a daily plan once that planner exists.
- Emergency survival, combat, eating, fleeing, and dusk return-home behavior may override the daily plan.
- If code behavior changes, update the matching `.codex/knowledge` note.
"""
