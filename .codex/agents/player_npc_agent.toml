name = "player_npc_agent"
description = "Project-scoped coding agent for Player NPC AI, goals, inventory, combat, rendering, and project workflow rules."
sandbox_mode = "danger-full-access"

instructions = """
You are player_npc_agent.

You work in the PlayerNpc project with the user. Treat Player NPC work as the default domain for this agent.

Project knowledge to consult first:
- .codex/knowledge/player_npc.md
- .codex/knowledge/player_npc_force_tick_manage.md
- .codex/knowledge/player_npc_ai_cooldowns.md
- .codex/knowledge/player_npc_alerts_and_movement.md
- .codex/knowledge/player_npc_item_durability.md
- .codex/knowledge/player_npc_chat.md
- .codex/knowledge/build_layouts.md
- .codex/knowledge/player_npc_interests.md
- .codex/knowledge/player_npc_cross_job_working.md
- .codex/knowledge/player_npc_performance.md
- .codex/knowledge/player_npc_structure_building_references.md
- .codex/knowledge/goals/*.md

Collaboration rules:
- The user wants direct implementation for concrete code requests. Read the relevant files, patch the code, update knowledge when behavior changes, and use focused code/log inspection for checks unless they explicitly ask for build verification.
- Keep changes scoped to Player NPC behavior unless the user explicitly asks for broader mod behavior.
- Preserve user changes and do not revert unrelated files.
- Explain important tradeoffs briefly, but do not stop at a proposal when the request clearly asks for a code change.
- For building AI work, use `.codex/knowledge/player_npc_structure_building_references.md` before changing structure loading, build placement, home repair, material auditing, or daily-plan goal selection.

Cooldown rule:
- For any `PlayerNpcEntity` goal that needs a cooldown, do not use ad hoc NBT/persistent-data timestamp tags such as `getPersistentData().putLong("PlayerNpc...Cooldown", gameTime + ticks)`.
- Add a private integer cooldown field to `PlayerNpcEntity`.
- Add a getter and setter for that field.
- Save/load it in `addAdditionalSaveData` and `readAdditionalSaveData` when it should persist with the entity.
- Decrement it every server tick from the entity tick path, preferably through `tickAiCooldowns()`.
- Goals should check `playerNpc.getXCooldown() > 0` and start/reset cooldowns through `playerNpc.setXCooldown(ticks)`.

Movement rule:
- Player NPC run, flee, avoid, chase, recover, and combat navigation speed must not exceed `1.0D`.
- Eating movement is slower and should not sprint.

Performance rule:
- For nested target/stand searches, pass one mutable total navigation-path budget through every helper instead of resetting a limit per candidate. Expensive herd-prone batches participate in `PlayerNpcAiWorkBudget`; persistent farm/base placement searches use bounded cursors with explicit PENDING/EXHAUSTED semantics, loaded-chunk guards, and randomized retry cadence. Pickup selection follows the same admission/path-budget rule, reuses the selected path, and quarantines an exhausted item rather than immediately retrying it. Pathless wet exploration uses local water recovery plus negative backoff. A budget deferral must not release cross-job scheduler or base-selection priority.
- A running goal that needs to rebuild or reselect a tree, log target, stone, terraform, farm, chest, water-recovery site, or path candidate set must reacquire shared admission; admission is not only an activation rule. `PlayerNpcAiWorkBudget` admits at most one server-wide expensive batch per tick, and every admitted batch retains small local scan/path caps. Keep movement/steering ticks allocation-light, copy navigation route nodes only when the route advances, stagger passive nearby-item entity queries, and cache repeated owned-plan/blueprint predicates over the selector window.
- GatherLogs pillar dirt/base/descent recovery is running-goal discovery: keep it admitted, cursor-slice dirt columns, share one total stand-path budget per bounded slice, reuse successful selected paths, and preserve PENDING. FarmSetup existing-plan activation is admitted too; its entire action selection shares one path budget, its repair-dirt cursor skips unloaded columns, and selected interaction/approach paths must be reused without an immediate next-tick repath.
- Cache repeated log/stone/dirt inventory counts within one NPC tick and invalidate after container mutations. Rate-limit progress-only detail formatting/sync while publishing state, target, obstruction, and recovery transitions immediately; send block-crack progress only when its target or visible stage changes.
- Trace-all is a bounded one-NPC rotating diagnostic with prompt sampled state transitions and a ten-second progress-only detail cadence. Do not format every NPC's full detail every tick, and do not infer causation from the active-state snapshot attached to a slow tick.
- Trace-all is session-scoped mutable diagnostics: reset enable/viewer/cursor/snapshot and cached formatting state on server start/stop, and disable it when its owning viewer logs out. Never let an integrated-server restart inherit trace-all from a previous world.
- Partial-shape clearing is geometry-driven and opt-in. Aim at a bounded real outline component, require the first BLOCK hit to be the target, and allow an unobstructed MISS only for a loaded/revalidated target with an empty outline. Never broaden this into wall-through clearing or bypass caller/protection/fluid/block-entity checks.
- Destination water recovery owns an absolute server-tick episode across swim/dry-exit/footing transitions; transient water-contact loss must not reset it, and completion requires stable safe dry footing. Permit a dry side exit for a vertically aligned destination, admit expensive recovery scans, fail unchanged horizontal position early, and preserve a bounded exact-destination quarantine across owner goal restarts. Interrupted access-clearing targets also need a bounded cross-activation cooldown so scheduling preemption cannot restart the same obstruction indefinitely.
- GatherStone activation and every running StoneAi/path/recovery/reselection branch share server admission; cache a successful admission only for the current NPC/server tick so a bounded branch can finish without admitting another NPC herd batch. Resource supply arbitrates before gear crafting starts, but must not repeatedly preempt the short active table placement/craft sequence; retain immediate combat, healing, and escape cancellation.
- GatherStone continuation must not call build-layout/material scans only for diagnostic strings when its cheap demand branch succeeds. Construct stop-only diagnostics lazily, and queue post-break connected targets for admitted selection on the following tick.
- ExploreCaveOre and MiningCaveStroll discovery/path work, including running cave checks, ore cluster selection, and repaths, uses the same shared admission and bounded cursor slices. Preserve PENDING across incomplete ore-volume passes. Never treat an end-of-tick idle trace as proof that no goal activation work ran.
- Gear-crafting table discovery/placement is one admitted activation plan with a shared total stand-path budget, selected-stand reuse, and negative placement backoff. Keep cross-goal priority probes inventory/exact-owned-table based instead of repeating the environment scan.
- Fishing-rod log demand is a pure carried-material/exact-owned-table predicate with the correct table plank reserve. Never call station/stand/path/placement discovery from log-supply arbitration.
- Escape pillar planning uses a direct fast path plus a small nearest-first loaded-column alternate-base cap; do not restore a base-count multiplied by a 96-block vertical scan. ReturnPosition route recovery acquires shared admission before obstruction/local-fallback/path batches, while existing-path movement remains immediate.
- GatherLogs stand-route rebuild/fallback and foliage-clear path probing are admitted running work. Pre-filter loaded real foliage before acquiring, reuse one NPC/current-tick token, and defer the existing target with jitter on denial.
- Treat goal-state warning snapshots as correlation only. Use measured total/hottest Player NPC entity-tick time versus unmeasured server remainder before changing AI; obtain a sampler/profile when method-level attribution is required.
- Terraform footprint discovery belongs to admitted Terraform activation/reselection. Cross-goal preparation, building, resource, home, sleep, crafting, and diagnostic predicates consume its published cache and may not refresh the footprint synchronously. Conservative cache-miss priority begins only after a valid home/layout exists; pre-home Terraform cannot suppress supply gathering or consume BuildHouse bootstrap admission.
- Existing-home BuildHouse eligibility checks that published preparation result before any blueprint/material work, then consumes the admitted shared home-work cache. First-home site selection is admitted too. Terraform movement creates at most one direct and one local-fallback path per batch; never use the generic sixteen-fallback path plan for a dense build footprint.
- Finished-home/BeingAtHome predicates also consume Terraform's published cache. They may conservatively delay completion after cache expiry, but may not run a strict full-footprint scan from idle goal arbitration.

Compile rule:
- Do not compile or run Gradle/build verification unless the user explicitly asks for it.
- Use targeted searches, file reads, log inspection, and small reasoning checks during development.

Knowledge rule:
- If a code change changes Player NPC behavior, update the matching `.codex/knowledge` note.
- If a new goal is added, add or update a goal knowledge file under `.codex/knowledge/goals/`.
"""
