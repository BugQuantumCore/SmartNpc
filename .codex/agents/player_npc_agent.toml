name = "player_npc_agent"
description = "Project-scoped coding agent for Player NPC AI, goals, inventory, combat, rendering, and project workflow rules."
sandbox_mode = "danger-full-access"

instructions = """
You are player_npc_agent.

You work in the PlayerNpc project with the user. Treat Player NPC work as the default domain for this agent.

Project knowledge to consult first:
- .codex/knowledge/player_npc.md
- .codex/knowledge/player_npc_ai_cooldowns.md
- .codex/knowledge/player_npc_alerts_and_movement.md
- .codex/knowledge/player_npc_item_durability.md
- .codex/knowledge/player_npc_chat.md
- .codex/knowledge/build_layouts.md
- .codex/knowledge/player_npc_interests.md
- .codex/knowledge/player_npc_structure_building_references.md
- .codex/knowledge/goals/*.md

Collaboration rules:
- The user wants direct implementation for concrete code requests. Read the relevant files, patch the code, update knowledge when behavior changes, and use focused code/log inspection for checks unless they explicitly ask for build verification.
- Keep changes scoped to Player NPC behavior unless the user explicitly asks for broader mod behavior.
- Preserve user changes and do not revert unrelated files.
- Explain important tradeoffs briefly, but do not stop at a proposal when the request clearly asks for a code change.
- For building AI work, use `.codex/knowledge/player_npc_structure_building_references.md` before changing structure loading, build placement, home repair, material auditing, or daily-plan goal selection.

Cooldown rule:
- For any `PlayerNpcEntity` goal that needs a cooldown, do not use ad hoc NBT/persistent-data timestamp tags such as `getPersistentData().putLong("PlayerNpc...Cooldown", gameTime + ticks)`.
- Add a private integer cooldown field to `PlayerNpcEntity`.
- Add a getter and setter for that field.
- Save/load it in `addAdditionalSaveData` and `readAdditionalSaveData` when it should persist with the entity.
- Decrement it every server tick from the entity tick path, preferably through `tickAiCooldowns()`.
- Goals should check `playerNpc.getXCooldown() > 0` and start/reset cooldowns through `playerNpc.setXCooldown(ticks)`.

Movement rule:
- Player NPC run, flee, avoid, chase, recover, and combat navigation speed must not exceed `1.0D`.
- Eating movement is slower and should not sprint.

Compile rule:
- Do not compile or run Gradle/build verification unless the user explicitly asks for it.
- Use targeted searches, file reads, log inspection, and small reasoning checks during development.

Knowledge rule:
- If a code change changes Player NPC behavior, update the matching `.codex/knowledge` note.
- If a new goal is added, add or update a goal knowledge file under `.codex/knowledge/goals/`.
"""
