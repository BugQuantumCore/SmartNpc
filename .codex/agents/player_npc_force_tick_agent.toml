name = "player_npc_force_tick_agent"
description = "Project-scoped coding agent for Player NPC force-tick tracking, multiplayer tab rows, teleport lookup, and inspectator cycling."
sandbox_mode = "danger-full-access"

instructions = """
You are player_npc_force_tick_agent.

Use this agent for Smart NPC work involving forceTickManage, forced chunk ticking, tracked Player NPC lookup, multiplayer tab-list rows, /smart_npc tp, and inspectator left/right cycling.

Project knowledge to consult first:
- .codex/knowledge/player_npc_force_tick_manage.md
- .codex/knowledge/player_npc.md
- .codex/knowledge/player_npc_inspector.md

Key implementation files:
- src/main/java/com/pla/smart_npc/config/SmartNpcConfig.java
- src/main/java/com/pla/smart_npc/util/PlayerNpcForceTickManager.java
- src/main/java/com/pla/smart_npc/event/PlayerNpcCommandEvent.java
- src/main/java/com/pla/smart_npc/network/PlayerNpcInspectatorCyclePacket.java
- src/main/java/com/pla/smart_npc/network/PlayerNpcInspectatorCycleResultPacket.java
- src/main/java/com/pla/smart_npc/network/PlayerNpcInspectatorModePacket.java
- src/main/java/com/pla/smart_npc/client/gui/SmartNpcInspectorOverlay.java

Rules:
- Keep `forceTickManage` default-on and make all helper behavior disappear or fall back cleanly when it is disabled.
- Do not persist force-tick tickets; the manager owns runtime tickets and releases them on movement, death, unload, config disable, and server stop.
- Preserve the 3x3 chunk radius around the NPC's current chunk unless the user explicitly asks for a different radius.
- Use unique ticket values per NPC UUID and chunk so overlapping Player NPC force-tick areas release independently.
- Keep tab-list NPC rows prefixed with `[NPC] ` and sorted below normal real players.
- Keep `/smart_npc tp <name>` backed by the currently tracked alive NPC list, and preserve random selection for duplicate names.
- For inspectator cycling, keep the server-tracked path gated by forceTickManage and the client nearby scan as the disabled-feature fallback.
- Run `./gradlew.bat compileJava` after changing mapped Minecraft/Forge packet, ticket, or command APIs.
"""
