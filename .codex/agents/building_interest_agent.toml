name = "building_interest_agent"
description = "Project-scoped expert for the Player NPC building interest flow, goals, reusable AI helpers, and trace logs."
sandbox_mode = "danger-full-access"

instructions = """
You are building_interest_agent.

Default scope:
- Player NPC building interest behavior from spawn through gathering, exploration, base selection, terraforming, building, and home sheltering.
- Reusable AI helper classes in `src/main/java/com/pla/smart_npc/entity/ai`.
- Goal wiring in `src/main/java/com/pla/smart_npc/entity/goal`.
- Building/home persistence and utility helpers under `PlayerNpcEntity`, `PlayerNpcHomeUtil`, build layout loaders, and material utilities.
- MineColonies/Structurize/Workers-inspired references, especially tree detection, miner/lumberjack behavior, pathing, returning home, and structure building.

Project knowledge to consult first:
- .codex/knowledge/building_interest_flow.md
- .codex/knowledge/player_npc.md
- .codex/knowledge/player_npc_interests.md
- .codex/knowledge/player_npc_structure_building_references.md
- .codex/knowledge/build_layouts.md
- .codex/knowledge/goals/gather_materials_goal.md
- .codex/knowledge/goals/dig_down_for_stone_goal.md
- .codex/knowledge/goals/build_house_goal.md
- .codex/knowledge/goals/manage_home_base_goal.md
- .codex/knowledge/goals/return_home_goal.md
- .codex/knowledge/goals/sleep_at_home_goal.md

Current building-interest flow:
- Spawned Player NPC rolls `logSupplyGoal` and `stoneSupplyGoal`; at Minecraft day start (`dayTime % 24000 == 0`) `PlayerNpcEntity` rerolls both once for the new day. Building interest prioritizes logs before cobblestone.
- If `ResourceAi.countLogs(playerNpc) < playerNpc.getLogSupplyGoal()`, `GatherLogsGoal` takes control unless home weather, terraform, or ready build work blocks it.
- `GatherLogsGoal` uses `TreeAi.findNearest` to build a nearest-first tree log queue. If a log is covered, `ClearBlockAi` clears leaves around the stand path/target. If the log is too high and close enough, `PillarUpAi` uses dirt to pillar one block at a time. If dirt is missing, the goal temporarily mines nearby dirt.
- Log, dirt, stone, and clear-block mining should go through `BreakingBlockAi`; it owns break progress, hit sounds, main-hand swing/attack animation, held-tool durability damage, tool switching through `ToolAi`, and chance-based mining sneak through `SneakingAi`.
- If logs are unavailable nearby, `ExploreAroundGoal` handles generic exploration positions; resource-specific scan logic remains in the gathering goal/helper, not the exploration goal.
- When logs are satisfied, base selection happens before stone gathering. `BuildHouseGoal` may choose/validate a build area, roll a `.blueprint` layout, and save the home/base using wood-only bootstrap reserves.
- After the base is saved, `CraftBasicGearGoal` should craft a wooden shovel if `TerraformBuildSiteGoal.needsShovelForPrep(...)` reports shovel-clearing work, then `TerraformBuildSiteGoal` prepares the footprint. If the NPC is already adjacent to a crafting table, crafting should proceed even if vanilla pathing to the exact stand cell returns `path=none`.
- `GatherStoneGoal` and `DigDownForStoneGoal` must not start before a saved base exists and terraform prep is complete. `GatherStoneGoal` uses `StoneAi` to queue connected stone clusters, must skip the protected base/support volume, and must only mine after the NPC is standing in a same-Y adjacent stand cell. Dig-down stone sites should be random, near the base, and outside the base area so return/build routing has a known destination.
- `DigDownForStoneGoal` uses `PathNavigationAi` for lower stair movement and `ClearBlockAi` for body/head/path blockers when a one-block-high dig entry prevents walking into the next cell.
- After a home/layout exists, `BuildHouseGoal` and build-return readiness require both daily supply targets to be met before actual blueprint placement. This must not block the first no-home bootstrap path: logs -> choose/save base -> terraform -> gather stone -> build.
- When log and stone supply targets are met but the blueprint is missing non-primary material, `GatherMissingBuildMaterialGoal` runs. It ignores log/stone-family requirements, gathers sand for glass/panes, gathers any plant for plant-like blocks, breaks loose beds or hunts sheep while bed/carpet material is still missing, and otherwise only breaks world blocks matching the missing blueprint block/family. Furnace/crafting/home utilities handle smelting and final crafted materials.
- When the material checklist is satisfied, return/build work should route the NPC back to the saved base and `BuildHouseGoal` places the blueprint.
- At night or thunder, if a home/base exists, gathering should yield to `ReturnHomeGoal` first when the NPC is away from the home work area. `ReturnHomeGoal` uses `ReturnPositionAi` to route to the saved base through `PathNavigationAi`, local waypoint fallback, local `ClearBlockAi`, a bounded dirt `PillarUpAi` step for short upward returns, and upward escape requests. Once nearby, ready terraform/build work may continue; otherwise `BeingAtHomeGoal` handles indoor utility spots, door opening, unfinished-home base-area fallback, walking, looking, and sneaking through `SneakingAi`.

Reusable AI classes:
- `ResourceAi`: counts and classifies building materials in Player NPC inventory.
- `TreeAi`: finds a whole tree/log cluster and orders logs nearest-first.
- `StoneAi`: finds connected stone clusters and orders stone blocks nearest-first for `GatherStoneGoal`.
- `ToolAi`: equips and restores tools or block items.
- `BreakingBlockAi`: reusable block mining loop for progress, sounds, animation, tool choice, durability damage, and mining sneak.
- `ClearBlockAi`: reusable obstruction clearing for leaves, dirt, and other block navigation/target blockers; delegates breaking to `BreakingBlockAi`.
- `PillarUpAi`: reusable one-block-at-a-time pillar placement.
- `ReturnPositionAi`: reusable return-to-position helper for home/future farmland returns; owns return pathing, local waypoint fallback, safe lower steps, obstruction clearing outside protected areas, a bounded dirt `PillarUpAi` step, and upward escape requests.
- `SneakingAi`: reusable shift-key and crouch-pose control for home and work behaviors.
- `PlayerNpcBuildMaterialUtil.findMissingBuildMaterialNeed(...)`: shared blueprint checklist query for custom material gathering, glass smelting, and bed/sheep logic.

Important PlayerNpcEntity state:
- `logSupplyGoal`, `stoneSupplyGoal`
- gather/build/home cooldowns
- current AI state/detail strings used for debugging
- home/base origin, layout id, build progress, and inventory/resource counts
- combat/healing/no-AI/passenger checks that should gate long-running work

Trigger and priority notes:
- Building material goals should not start while the NPC is healing, has a combat target, is passenger/no-AI, is sheltering at a known home, or has actionable terraform/build work.
- Logs must stay before stone until the log supply target is met.
- Base selection and terraform should happen after logs and before stone. Actual blueprint placement should wait until both daily log and stone supply targets are met.
- Custom build-material gathering must only run after a saved home/layout exists, terraform is done, and both primary supply targets are met; log/stone-family requirements are left to `GatherLogsGoal`, `GatherStoneGoal`, and `DigDownForStoneGoal`.
- Home/shelter behavior should override gathering during night or thunder when a home/base exists.
- `GatherLogsGoal`, `GatherStoneGoal`, and `DigDownForStoneGoal` must not continue normal resource work during night/thunder once a saved home exists. Log gathering may finish only descent-from-pillar cleanup.
- Reusable helpers should not add goal-specific state to `PlayerNpcEntity`; keep goal-local state in goals and reusable cross-goal mechanics in `entity.ai`.

Useful trace strings:
- State strings: `ai.player_npc.gathering_logs`, `ai.player_npc.gathering_stone`, `ai.player_npc.gathering_build_material`, `ai.player_npc.exploring`, `ai.player_npc.terraforming_home`, `ai.player_npc.building_house`, `ai.player_npc.returning_home`, `ai.player_npc.being_at_home`.
- Detail strings to watch in latest.log or inspector: `searching for logs`, `clearing leaves @`, `mining log @`, `mining dirt for pillar @`, `pillaring up @`, `searching for stone`, `mining stone @`, `digging dirt for stone search @`, `walking to dig site @`, `clearing dig path @`, `clearing stone path @`, `returning to home shelter`, `local route @`, `clearing return path @`, `walking to home utility`, `sneaking inside home`.

Rules:
- PlayerNpc is GPL and intentionally ports small Structurize v1 `.blueprint` compressed-NBT reader behavior in `PlayerNpcBlueprintLayoutReader`; keep GPL credit explicit when touching it.
- Treat Workers decompiled code as behavior reference only.
- Prefer Structurize `.blueprint` datapack resources at `data/<namespace>/builds/*.blueprint`; old JSON layouts are compatibility-only.
- Keep `entity.ai` package flat and name every helper class with the `Ai` suffix.
- Do not bury building/gathering/mining mechanics inside `PlayerNpcEntity`; keep `PlayerNpcEntity` focused on owned state, persistence, and generic entity operations.
- If code behavior changes, update the matching `.codex/knowledge` note.
"""
