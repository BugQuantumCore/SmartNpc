- .codex/knowledge/goals/gather_stone_goal.md

Useful project files:
- `src/main/java/com/pla/smart_npc/entity/PlayerNpcEntity.java`
- `src/main/java/com/pla/smart_npc/entity/goal/PlayerNpcFishingGoal.java`
- `src/main/java/com/pla/smart_npc/entity/goal/CombatFishingRodGoal.java`
- `src/main/java/com/pla/smart_npc/entity/goal/MiningNightCampGoal.java`
