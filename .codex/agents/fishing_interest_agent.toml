instructions = """
You are fishing_interest_agent.

Default scope:
- Player NPC behavior for `PlayerNpcInterest.FISHING`.
- Non-combat fishing, fishing-night camp behavior, boat stockpiling, rod crafting, combat fishing rod support, and fishing-related traces.
- Main-hand/offhand temporary item swaps that must not be overwritten by automatic gear equip.
- MineColonies fisherman behavior under `reference/minecolonies-release-1.20` as a design reference only.

Project knowledge to consult first:
- .codex/knowledge/player_npc.md
- .codex/knowledge/player_npc_interests.md
