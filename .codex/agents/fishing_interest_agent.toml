MineColonies reference files:
- `reference/minecolonies-release-1.20/src/main/java/com/minecolonies/coremod/entity/ai/citizen/fisherman/EntityAIWorkFisherman.java`
- `reference/minecolonies-release-1.20/src/main/java/com/minecolonies/coremod/colony/buildings/workerbuildings/BuildingFisherman.java`

Current SmartNpc fishing-interest flow:
- `PlayerNpcEntity.registerGoals()` gates `PlayerNpcFishingGoal`, `BoatStockpileGoal`, and `CombatFishingRodGoal` behind `PlayerNpcInterest.FISHING`.
- Fishing is a daily job. Use `playerNpc.isDailyJobActive(PlayerNpcInterest.FISHING)` for daytime fishing-specific exploration and work decisions, not only the raw interest.
- Fishing NPCs still share support work for logs and stone. `GatherLogsGoal`, `GatherStoneGoal`, and `DigDownForStoneGoal` can run for FISHING so a fisher can satisfy supply/tool needs before fishing.
- During a FISHING active stone-support phase, `CraftBasicGearGoal` may interrupt only for a missing pickaxe. Once the fisher has a pickaxe, defer shovel/upgrade/sword/rod crafting until stone support is complete so crafting cannot consume the just-satisfied cobble supply and reopen gathering.
- `CraftBasicGearGoal` can craft a missing fishing rod after critical starter tools are handled and after the active stone-support phase is closed. For pure fishing jobs it should not craft optional stone upgrades or swords ahead of water exploration. Do not diagnose a fishing stall as rod-crafting priority if the NPC already has a usable rod in the main hand or inventory; in that case the next blockers are usually support supplies, water search, navigation, or climb/escape handling.
- Non-combat fishing waits for daytime, no thunder, no combat target, no healing/passenger/no-AI state, no active fishing cooldown, met log supply, met cobblestone supply, a usable rod in hand or inventory, and a reachable local fishing spot.
- Fishing-water exploration also waits for met log supply, met cobblestone supply, and a usable rod. It may request bounded upward escape through `ExploreAroundGoal`; the FISHING registration currently caps that request at 18 pillar blocks and must not bypass the log -> stone -> water flow.
- A fishing-water exploration climb request is not complete just because the requested surface target is within one block. `EscapeHoleWithBlockGoal` should keep the request active until the NPC reaches open-sky body space and is no longer trapped, so standing under leaves/tree cover can trigger pillar-path clearing or pillaring instead of idling with `exploration climb request`.
- Fishing water search scans a bounded local volume, accepts water with open collision above and nearby water room, chooses a reachable stand position within cast distance, then chooses a cast water block from that stand.
- The goal first walks to the stand position with detail `walking to water @ x y z`; only after the stand is reached does it equip/cast and switch detail through `casting @ x y z`, `hook @ x y z`, and `bite @ x y z`.
- The fishing rod must be in the main hand for the cast and wait. Temporary rod swaps must use `PlayerNpcEntity.setMainHandItemForAi(...)`, and `PlayerNpcEntity.shouldPauseMainHandAutoEquip()` must include `ai.player_npc.fishing` so automatic weapon/tool upgrades do not replace the rod with a sword, axe, pickaxe, bow, or other main-hand gear mid-cast.
- After casting, continuation should require the active main-hand rod, not merely any rod elsewhere in inventory. If another behavior displaces the rod, the fishing goal should end rather than wait/retrieve with a wrong item.
- Retrieving swings the main hand, plays retrieve sound, asks `PlayerNpcFishingBobberEntity` to retrieve, and damages the active rod by the returned durability cost. The custom bobber owns vanilla `BuiltInLootTables.FISHING` loot generation with the rod as `LootContextParams.TOOL`.
- Loot is inserted into the Player NPC inventory; overflow is dropped in world. Successful insertion plays the inventory pickup sound.
- Stop restores the previous main hand after stashing the temporary rod back into inventory or dropping it if inventory is full, then sets `fishingCooldown`.
- Combat fishing is separate: `CombatFishingRodGoal` temporarily equips the rod in the offhand, casts visually, pulls the current target, damages the offhand rod, restores the previous offhand, and uses `combatFishingCooldown`.
- `MiningNightCampGoal` can pause a FISHING daily job at night/thunder by moving the fisher to a temporary safe camp instead of continuing water work.

MineColonies fisherman flow to preserve as reference:
- `BuildingFisherman` keeps one fishing rod as required worker equipment.
- `EntityAIWorkFisherman` starts at the worker building, prepares by checking/requesting a fishing rod, then moves through water search, walking to water, angle checks, and fishing.
- MineColonies stores remembered ponds, randomly reuses known ponds, can search for new reachable water through `moveToWater(...)`, and removes invalid/stuck pond choices after repeated failed rotations.
- Before fishing, `isReadyToFish()` verifies a rod slot, verifies nearby water, and calls `equipRod()` when the main hand does not match the inventory rod slot.
- `equipRod()` delegates to the citizen item handler's held-item slot logic, so the worker really holds the rod before throwing.
- `throwRod()` faces the chosen water, plays the bobber throw sound, creates a custom bobber entity, configures luck/lure values from skill and rod enchantments, adds it to the world, and swings.
- While the hook exists, the AI marks it in use, retrieves if it is stuck, and catches only when the hook is ready and the random skill check passes.
- Retrieval swings, asks the bobber for damage/loot behavior, removes the bobber, damages the rod in the main hand, and can generate bonus building-level loot and XP.

Rules:
- Keep fishing mechanics in `PlayerNpcFishingGoal` or focused reusable helpers, not as broad behavior blobs in `PlayerNpcEntity`.
- Do not rely on a vanilla `FishingHook` owned by `PlayerNpcEntity`; vanilla hooks require a real player owner. SmartNpc uses `PlayerNpcFishingBobberEntity` for cast, wait, retrieve, durability, and loot behavior.
- Do not let main-hand auto-equip replace a temporary fishing rod during `ai.player_npc.fishing`.
- Do not treat rods as permanent weapons when temporarily equipping them. Use guarded AI hand setters for main-hand fishing swaps.
- Keep fishing, night camp, boat, and combat-fishing cooldowns as integer fields on `PlayerNpcEntity`; save/load and tick persistent cooldowns through `tickAiCooldowns()`.
- Fishing, water search, boat stock, and camp movement speeds should stay at or below `1.0D`.
- Do not compile or run Gradle/build verification unless the user explicitly asks for it. Use focused code inspection, trace logs, and targeted searches by default.
- If fishing behavior changes, update `.codex/knowledge/goals/player_npc_fishing_goal.md`. If shared Player NPC gear or interest behavior changes, update the matching `.codex/knowledge` note too.

Useful trace strings:
- `ai.player_npc.fishing`
- `ai.player_npc.combat_fishing`
- `ai.player_npc.fishing_night_camp`
- `walking to water @`
- `casting @`
- `hook @`
- `bite @`
- `exploring for water`
- `fishing camp`
- `combatFish=`
- `fish=`
"""
